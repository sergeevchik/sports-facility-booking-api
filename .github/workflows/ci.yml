name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    name: Quality and PostgreSQL tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17-bookworm@sha256:1eff563f6c868b9b433566e9f3cf6e5c79fbd3b95bf70ec7277d376cdbfc50d7
        env:
          POSTGRES_DB: booking_test
          POSTGRES_USER: booking
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U booking -d booking_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://booking@localhost:5432/booking_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - name: Scan all Git history for secrets
        run: |
          mkdir -p artifacts
          docker run --rm --network none \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            -v "$GITHUB_WORKSPACE:/repo:ro" -v "$GITHUB_WORKSPACE/artifacts:/out" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git /repo --log-opts=--all --redact --report-format json --report-path /out/gitleaks.json
      - name: Ruff analysis and formatting
        run: |
          mkdir -p artifacts
          ruff check . --output-format github
          ruff format --check .
          ruff check . --output-format json > artifacts/ruff.json
      - name: Unit, integration and concurrency tests
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --junitxml=artifacts/junit.xml
      - name: Save test and analysis reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: quality-reports
          path: artifacts/
  compose:
    name: Compose and monitoring smoke
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - run: python -m pip install httpx==0.28.1 python-dotenv==1.2.4
      - run: python scripts/bootstrap.py
      - run: docker compose up -d --build --wait --wait-timeout 180
      - name: Seed demo data and verify deployed API
        run: |
          mkdir -p artifacts
          docker compose exec -T api python -m app.seed
          python scripts/smoke.py --output artifacts/smoke.json
      - name: Verify real metrics and provisioned dashboard
        run: |
          sleep 10
          python scripts/check_monitoring.py
      - name: Save smoke evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: deployment-reports
          path: artifacts/
      - name: Diagnostics
        if: failure()
        run: docker compose logs --tail=80
      - name: Stop temporary CI environment
        if: always()
        run: docker compose down -v
  publish:
    name: Publish versioned multi-platform image
    needs: [quality, compose]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Determine immutable source and release tags
        id: tags
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "sha_tag=$image:sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=$image:${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=$image:main" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.tags.outputs.sha_tag }}
            ${{ steps.tags.outputs.release_tag }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=1.0.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify registry image and immutable provenance
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker pull "$IMAGE@$DIGEST"
          docker image inspect "$IMAGE@$DIGEST" --format '{{json .Config.Labels}}'
          docker run --rm --entrypoint python "$IMAGE@$DIGEST" -c "import app.main; print('Published image import passed')"
          echo "Published $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
