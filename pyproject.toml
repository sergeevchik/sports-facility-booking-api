[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sports-facility-booking-api"
version = "1.0.0"
description = "Transactional sports facility reservations with a reproducible DevOps environment"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4", "alembic>=1.14,<2", "pydantic-settings>=2.7,<3",
  "prometheus-client>=0.21,<1", "tzdata>=2025.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "httpx>=0.28,<1", "ruff>=0.11,<1", "locust>=2.33,<3", "pyyaml>=6,<7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires an isolated PostgreSQL database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.coverage.run]
source = ["app"]
omit = ["app/asgi.py", "app/seed.py"]

[tool.coverage.report]
show_missing = true
